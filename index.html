<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rejoindre les testeurs PharmaCabinet</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(130deg,#10283f,#173e4a);font-family:system-ui,Arial;color:#eafffb;padding:20px}.card{background:#1a394a;border:1px solid #5ce0ce;border-radius:20px;padding:30px;max-width:510px;width:100%;box-sizing:border-box}h1{font-size:28px}label{display:block;margin-top:18px}input,select{font:16px system-ui;padding:13px;border-radius:8px;width:100%;box-sizing:border-box;margin-top:7px}.check{display:flex;align-items:flex-start;gap:10px;font-size:14px}.check input{width:auto}button{margin-top:20px;padding:16px;width:100%;border:0;border-radius:12px;background:#4be0bd;font-weight:750;font-size:17px}p{line-height:1.55}.hint{font-size:13px;color:#cae3e5}#result{padding:12px}a{color:#85ffe3}</style></head><body><main class="card"><h1>💊 Testez PharmaCabinet !</h1><p>Participez gratuitement au test interne Android. Utilisez l’adresse Gmail ou Google de votre compte Play Store.</p><form id="form"><label>Votre adresse Google Play *<input type="email" name="email" required maxlength="254" autocomplete="email"></label><label>Version Android (facultatif)<select name="android"><option value="">Je ne sais pas</option><option>Android 16</option><option>Android 15</option><option>Android 14</option><option>Android 13</option><option>Android 12 ou moins</option></select></label><label>Combien font 3 + 4 ? *<input type="number" name="captcha" required min="0" max="20"></label><label class="check"><input type="checkbox" name="consent" value="yes" required><span>J’accepte l’enregistrement de mon adresse pour gérer mon inscription au test PharmaCabinet.</span></label><input type="text" name="website" style="display:none" autocomplete="off" tabindex="-1"><button type="submit">Je m’inscris au test</button></form><p id="result" role="status"></p><p class="hint">Après inscription, votre e-mail doit être validé et ajouté dans Google Play Console. L’accès n’est pas immédiat. Aucune donnée de santé n’est demandée.</p></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const form=e.target,result=document.getElementById('result'),b=form.querySelector('button');b.disabled=true;result.textContent='Envoi en cours…';try{const response=await fetch('https://rclvpkfhpvifcyymrccu.supabase.co/functions/v1/pharmacabinet-testeurs',{method:'POST',body:new FormData(form)});const data=await response.json();result.textContent=data.message || 'Une erreur est survenue.';if(data.ok)form.reset();}catch(err){result.textContent='Erreur de connexion. Merci de réessayer.'}finally{b.disabled=false}});</script></body></html>
